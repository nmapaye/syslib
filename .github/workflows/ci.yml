name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        san: [none, asan-ubsan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up compiler
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then echo "CXX=g++" >> $GITHUB_ENV; else echo "CXX=clang++" >> $GITHUB_ENV; fi
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ clang ccache
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja ccache
      - name: Cache ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.compiler }}-${{ hashFiles('**/CMakeLists.txt', '**/*.hpp', '**/*.h', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.compiler }}-
            ${{ runner.os }}-ccache-
      - name: Cache FetchContent
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ./.cache/fetchcontent
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            ${{ runner.os }}-fetchcontent-
      - name: Configure sanity
        run: |
          cmake -S . -B build/sanity -G Ninja -Werror=dev -Wdeprecated \
            -DSYSLIB_BUILD_TESTS=OFF -DSYSLIB_BUILD_BENCHMARKS=OFF
      - name: Configure preset
        run: |
          PRESET=${{ matrix.san == 'asan-ubsan' && 'asan-ubsan' || 'release' }}
          echo "Using preset: $PRESET with CXX=$CXX"
          cmake --preset $PRESET
      - name: Build
        run: |
          PRESET=${{ matrix.san == 'asan-ubsan' && 'asan-ubsan' || 'release' }}
          cmake --build --preset $PRESET -j 2
      - name: Test
        run: |
          PRESET=${{ matrix.san == 'asan-ubsan' && 'asan-ubsan' || 'release' }}
          ctest --preset $PRESET
